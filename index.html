<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>CONSULTOR MEDICO | Asistente virtual</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="aplicacion">
        <header class="encabezado">
            <div class="icono-medico" aria-hidden="true">+</div>

                <h1>CONSULTOR MEDICO</h1>
                <p><span class="indicador"></span> Asistente virtual</p>
            </div>
        </header>

        <section class="zona-chat" id="zona-chat" aria-label="zona chat">

                <p>Estoy acá para responder tus consultas sobre trámites y temas médicos.</p>
            </div>

            <div class="mensajes" id="mensajes"

            <form id="formulario-chat">
                <label for="mensaje" class="etiqueta-oculta">Escribí tu consulta</label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    placeholder="Escribí tu consulta acá..."

                    maxlength="2000"

        </section>
    </main>
</body>
